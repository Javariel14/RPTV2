name: Foundation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Verify Foundation and CRM integration
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          npm run verify 2>&1 | Tee-Object -FilePath work/u3-verify.log
          exit $LASTEXITCODE
      - run: npm run supply-chain
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: foundation-evidence
          path: |
            work/*-evidence.json
            work/*-summary.json
            work/npm-audit.json
            work/license-report.json
            work/sbom.cdx.json
            work/e2e-results.json
            work/u3-verify.log
            work/pg-*/restored.log
            playwright-report
          retention-days: 14
  crm-e2e:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: U3 + U4 CRM E2E (isolated synthetic PostgreSQL)
        run: npm run test:crm:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: u3-crm-evidence
          path: |
            work/u3-e2e-results.json
            work/u3-playwright-report/
            work/u3-visual/
            work/u3-browser-results/
            work/u4-visual/
            work/u4-e2e-results.json
          retention-days: 14
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  staging-readiness:
    if: vars.RPT_STAGING_CHECKS_ENABLED == 'true'
    needs: [verify, crm-e2e, sast, secrets]
    runs-on: windows-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
      - run: npm ci
      - run: npm run staging:check
        env:
          RPT_STAGING_API_URL: ${{ vars.RPT_STAGING_API_URL }}
